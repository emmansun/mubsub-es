name: Run tests

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
        mongodb-version: ['6.0', '7.0', '8.0', '9.0']
        mongodb-driver-version: ['6.20.0', '7.7.0']

    steps:
    - name: Git checkout
      uses: actions/checkout@v6

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v6
      with:
        node-version: ${{ matrix.node-version }}

    - name: Start MongoDB
      uses: supercharge/mongodb-github-action@1.12.1
      with:
        mongodb-version: ${{ matrix.mongodb-version }}

    - run: npm install --no-save --package-lock=false mongodb@${{ matrix.mongodb-driver-version }}

    - run: npm test
      env:
        CI: true
